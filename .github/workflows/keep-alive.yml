name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity.
# A tiny read every 3 days keeps the database awake. RLS returns no rows to anon.
on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          set -a; . ./.env.production; set +a
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/goals?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY")
          echo "Supabase responded $code"
          test "$code" = "200"
